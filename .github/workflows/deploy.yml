name: Build & Deploy

on:
  push:
    branches: [ main, develop, feat/*, refactor/*, fix/* ]
  pull_request:
    branches: [ main, develop, feat/*, refactor/*, fix/* ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm -F @mportafolio/web lint

  # Runs in parallel with test-e2e (both only need `install`)
  test-unit:
    timeout-minutes: 10
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (with coverage)
        run: pnpm -F @mportafolio/web test:coverage

      - name: Upload Vitest coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: apps/web/coverage/
          retention-days: 7

      - name: Upload Vitest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-html-report
          path: apps/web/.vitest/
          retention-days: 7

  # CV backend (apps/api): domain, request parser, use cases end-to-end on a sandbox, CLI and HTTP
  test-backend:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Run backend tests
        run: uv run --project apps/api --extra dev --extra api python -m pytest apps/api/tests -q

  # Runs in parallel with test-unit; Playwright itself shards its specs across 2 workers (see playwright.config.ts)
  test-e2e:
    timeout-minutes: 15
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Node and pnpm versions
        run: node --version && pnpm --version
      
      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (2 parallel workers)
        run: pnpm -F @mportafolio/web test:e2e
        env:
          PLAYWRIGHT_WORKERS: 2

      - name: Upload Playwright report (E2E tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    needs: [lint, test-unit, test-backend, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -F @mportafolio/web build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always()
    needs: [lint, test-unit, test-backend, test-e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.lint.result }}" == "success" ] && [ "${{ needs.test-unit.result }}" == "success" ] && [ "${{ needs.test-backend.result }}" == "success" ] && [ "${{ needs.test-e2e.result }}" == "success" ] && [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build & Tests PASSED - Ready for deployment!"
          else
            echo "❌ Build or Tests FAILED - Review logs"
            exit 1
          fi

