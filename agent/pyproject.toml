[project]
name = "mportafolio-agent"
version = "0.2.0"
description = "Maestro MCP server: bridges .github/agents with the mi-portafolio skills and CV backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Andrés Rodríguez Pisa"}]
dependencies = [
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
