[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mportafolio-backend"
version = "3.0.0"
description = "mi-portafolio CV backend - applies change requests and renders the Word/PDF CV and web data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "ISC"}
authors = [
    {name = "Andrés Rodríguez Pisa", email = "andresrdrgzps05@gmail.com"}
]
keywords = ["portfolio", "cv", "docx", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-docx>=1.1",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.urls]
Homepage = "https://github.com/Harp-Andres/mi-portafolio"
Documentation = "https://github.com/Harp-Andres/mi-portafolio/wiki"
Repository = "https://github.com/Harp-Andres/mi-portafolio.git"
Issues = "https://github.com/Harp-Andres/mi-portafolio/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests/.*/setup.py
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
